 speak(text,lang){if(!("speechSynthesis" in window)){Voice.error="Speech is not supported in this browser. Try Chrome or Edge.";bindAll();return false}
  const c=settings(),u=new SpeechSynthesisUtterance(text);u.lang=Translation.code(lang);u.volume=c.volume;u.rate=c.rate;
  const v=Voice.voices().find(v=>v.name===c.voice)||Voice.voices().find(v=>v.lang.startsWith(u.lang));Voice.error=null;if(v)u.voice=v;else Voice.error=`No voice installed for ${lang}. Install a system voice for this language.`;
  u.onstart=()=>{Voice.status="Speaking";bindAll()};u.onend=()=>{Voice.status="Idle";bindAll()};u.onerror=e=>{Voice.status="Error";Voice.error="Voice error: "+e.error;bindAll()};
  Voice.last={text,lang};speechSynthesis.cancel();speechSynthesis.speak(u);return true},
 stop(){if("speechSynthesis" in window)speechSynthesis.cancel();Voice.status="Idle";bindAll()},replay(){Voice.last?Voice.speak(Voice.last.text,Voice.last.lang):toast("Nothing to replay yet")}};
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>render();

 if(/^(open|go to|show|kholo|kholein)\b/.test(s)){const m={setting:"Settings",help:"Help",language:"Language",monitor:"Monitor",dashboard:"Dashboard",developer:"Developer",training:"Developer",model:"Developer"};const k=Object.keys(m).find(x=>s.includes(x));if(k){go(m[k]);return {t:(hn?"Khol raha hoon: ":"Opening: ")+m[k]}}}

/* ===== EEG visualisation (requestAnimationFrame, no DOM churn) ===== */
const COL=["#4cc9f0","#8b7cf6"];
function drawCanvas(cv){const d=devicePixelRatio||1,w=cv.clientWidth*d,h=cv.clientHeight*d;if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}const g=cv.getContext("2d");g.clearRect(0,0,w,h);
 g.strokeStyle="rgba(143,160,186,.15)";g.lineWidth=1;g.beginPath();for(let i=1;i<8;i++){g.moveTo(w*i/8,0);g.lineTo(w*i/8,h)}for(let i=1;i<4;i++){g.moveTo(0,h*i/4);g.lineTo(w,h*i/4)}g.stroke();
 const chs=cv.dataset.w.split("").map(Number);
 chs.forEach((c,k)=>{const a=S.wave[c]||[];const lane=h/chs.length,mid=lane*(k+.5);if(a.length<2){g.strokeStyle=COL[c];g.globalAlpha=.25;g.beginPath();g.moveTo(0,mid);g.lineTo(w,mid);g.stroke();g.globalAlpha=1;return}
  let m=0;for(const v of a)m+=v;m/=a.length;let mx=1e-6;for(const v of a)mx=Math.max(mx,Math.abs(v-m));cv._s=(cv._s||{});cv._s[c]=Math.max(mx,(cv._s[c]||mx)*.97);const sc=lane*.42/cv._s[c];
  g.strokeStyle=COL[c];g.lineWidth=2*d;g.lineJoin="round";g.shadowColor=COL[c];g.shadowBlur=ui.rm?0:10;g.beginPath();const step=Math.max(1,Math.floor(a.length/w*d));
  for(let i=0,x=0;i<a.length;i+=step){const X=i/(a.length-1)*w,Y=mid-(a[i]-m)*sc;x++?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke();g.shadowBlur=0})}
(function loop(){if(!document.hidden)$$("canvas[data-w]").forEach(drawCanvas);requestAnimationFrame(loop)})();

/* ===== Prediction handling: confidence -> stability -> duplicate protection -> voice ===== */
function onCommStopped(){Voice.stop();S.cur=null;S.wait="";S.streak={label:null,n:0};bindAll()}
function onPrediction(ev){if(!comm())return;const c=settings();   /* Communication OFF: nothing is interpreted */
 if(S.lastSpoken.label&&ev.label!==S.lastSpoken.label)S.lastSpoken.other=true;
 if(ev.confidence==null||ev.confidence<c.threshold){S.wait=L("Low confidence — waiting for a clearer signal","Low confidence — saaf signal ka intezaar","कम विश्वास — स्पष्ट सिग्नल की प्रतीक्षा");S.streak={label:null,n:0};bindAll();return}
 S.streak=S.streak.label===ev.label?{label:ev.label,n:S.streak.n+1}:{label:ev.label,n:1};
 if(S.streak.n<c.debounce){S.wait=L(`Processing / waiting for stable command (${S.streak.n}/${c.debounce})`,`Processing / stable command ka intezaar (${S.streak.n}/${c.debounce})`,`प्रक्रिया / स्थिर कमांड की प्रतीक्षा (${S.streak.n}/${c.debounce})`);bindAll();return}
 S.wait="";const text=Translation.translate(ev.label,c.lang);if(!text){setErr("Translation unavailable","No translation for "+ev.label+" in "+c.lang);return}
 S.cur={...ev,text};const now=Date.now(),dup=S.lastSpoken.label===ev.label&&!S.lastSpoken.other,cool=now-S.lastSpoken.t<c.cooldown;
 if(!dup&&!cool){S.history.unshift({ts:now,label:ev.label,confidence:ev.confidence,text,spoken:c.voiceOn});S.history=S.history.slice(0,50);store.set(K("history"),S.history);
  S.lastSpoken={label:ev.label,t:now,other:false};if(c.voiceOn){if(!Voice.speak(text,c.lang))toast(Voice.error||"Voice unavailable","err")}}
 bindAll()}
function speakCur(){const lab=S.cur?.label||LABELS[0],tx=S.cur?.text||Translation.translate(lab,settings().lang);if(!Voice.speak(tx,settings().lang))toast(Voice.error||"Voice unavailable","err")}
function toggleVoice(){setSetting("voiceOn",!settings().voiceOn);if(!settings().voiceOn)Voice.stop();bindAll()}

/* ===== WebSocket ===== */
let sock=null,lastSig="",lastBind=0,lastErr="";
const setErrOnce=m=>{if(m!==lastErr){lastErr=m;setErr("Problem detected",m+" — check the USB cable and press Connect Device again.",connectDevice)}};
function openSocket(){if(sock)return;try{sock=new WebSocket(WSURL)}catch{return}
 sock.onmessage=m=>{const d=JSON.parse(m.data),was=comm();S.status=d.status;if(d.status.error)setErrOnce(d.status.error);
  for(const r of d.rows)r.forEach((v,i)=>{const a=S.wave[i]=S.wave[i]||[];a.push(v);if(a.length>S.status.fs*5)a.shift()});
  d.events.forEach(e=>e.ok?onPrediction(e):setErrOnce(e.error));if(was&&!comm())onCommStopped();
  const now=performance.now();if(now-lastBind>250){lastBind=now;const sig=[st().connected,comm(),modelOk(),eegOk()].join();if(sig!==lastSig){lastSig=sig;render()}else bindAll()}};
 sock.onclose=()=>{sock=null;setTimeout(openSocket,2000)}}

async function recordFlow(){if(!R.sel)return;R.dur=Math.max(4,+$("#dur").value||20);R.msg="";R.stop=false;
 try{if(prod()&&!st().connected)throw new Error("Device not connected");for(R.phase="count",R.n=3;R.n>0;R.n--){paintRec();await sleep(1000)}
  if(prod())await api("/api/recording/start/"+R.sel,"POST");R.phase="rec";for(R.t=0;R.t<R.dur&&!R.stop;R.t++){paintRec();await sleep(1000)}paintRec();
  if(prod()){const m=await api("/api/recording/stop","POST");R.msg=m.recording_id+".csv"}
  else throw new Error("Recording requires the Arduino device")}
 catch(e){if(prod())try{await api("/api/recording/stop","POST")}catch{}setErr("Recording failed",e.message+". Connect the device and try again.");R.msg=""}
 R.phase="idle";paintRec();showRecs()}
async function showRecs(){let l=[];try{l=prod()?await api("/api/recordings"):store.get(K("recordings"),[])}catch{}const h=$("#hist");if(!h)return;
 h.innerHTML=l.length?l.slice().reverse().map(r=>`<div class="hi"><b>${esc(r.recording_id)}.csv</b><span class="mut">${esc(r.label)} · ${(+r.duration_s).toFixed(0)}s · ${esc(String(r.datetime).slice(0,16))}</span></div>`).join(""):empty("No recordings yet","Create your first EEG command recording.")}

/* ===== Actions ===== */
const go=p=>{page=p;store.set("dhvani:page",p);nav(false);render()};
function nav(open,toggle){const s=$("#side");const o=toggle?!s.classList.contains("open"):!!open;s.classList.toggle("open",o);$("#scrim").classList.toggle("show",o)}
const setDev=v=>{S.dev=v;store.set("dhvani:dev",v);render()};
async function connectDevice(){try{const c=settings(),p=await api("/api/ports");let port=c.port,info=p.find(x=>x.device===port);
  if(!info){const candidates=p.filter(x=>!/bluetooth/i.test(`${x.description||""} ${x.hwid||""}`)),auto=candidates.find(x=>/arduino/i.test(`${x.description||""} ${x.hwid||""}`))||(candidates.length===1?candidates[0]:null);if(auto){info=auto;port=auto.device;setSetting("port",port)}}
  if(!info){const found=p.map(x=>`${x.device} (${x.description||"Serial device"})`).join(", ");throw new Error(found?`Select the Arduino USB serial port in Settings. Detected ports: ${found}. Bluetooth virtual ports are not the UNO R4 Minima USB connection.`:"No serial ports detected. Connect the Arduino with a data-capable USB cable, install/select its board driver, then refresh the port list.")}
  if(/bluetooth/i.test(`${info.description||""} ${info.hwid||""}`))throw new Error(`${port} is a Bluetooth virtual COM port, not the Arduino UNO R4 Minima USB port. Connect the Arduino by USB, refresh the port list, and select its USB serial port.`);
  S.status=await api("/api/eeg/connect","POST",{port,baud:c.baud,channels:c.channels,sampling_rate:c.fs,delimiter:c.delim});lastErr="";openSocket();await refreshModel();toast("Device connected","ok")}
 catch(e){setErr("Connection failed",e.message,connectDevice)}render()}
async function disconnectDevice(){if(comm())onCommStopped();try{S.status=await api("/api/eeg/disconnect","POST")}catch(e){setErr("Disconnect failed",e.message)}render()}
async function toggleComm(){
 if(comm()){st().live=false;onCommStopped();try{await api("/api/live/stop","POST");S.status=await api("/api/eeg/status")}catch(e){setErr("Could not stop cleanly",e.message)}}   /* local stop first: nothing more is spoken */
 else{if(!st().connected){setErr("Cannot start",t("noard"));return}if(!modelOk()){setErr("Cannot start",t("nomodel"));return}
  try{S.streak={label:null,n:0};S.lastSpoken={label:null,t:0,other:false};S.cur=null;S.wait="";await api("/api/live/start","POST");S.status=await api("/api/eeg/status");toast(t("on"),"ok")}catch(e){setErr("Cannot start communication",e.message)}}
 render()}
function trainModel(){confirmBox(L("Retrain model?","Model dobara train karein?","मॉडल दोबारा ट्रेन करें?"),L("This replaces the production model with one trained on all current recordings.","Yeh production model ko current recordings par train naye model se replace karega.","यह उत्पादन मॉडल को नए मॉडल से बदल देगा।"),()=>act("/api/model/train","POST"))}
async function act(path,method){try{await api(path,method);await refreshModel();if(path.includes("train"))poll();else toast("Model loaded","ok")}catch(e){setErr("Model action failed",e.message)}render()}
function poll(){const i=setInterval(async()=>{await refreshModel();render();if(S.model?.training?.status!=="running")clearInterval(i)},1000)}
async function refreshModel(){try{S.model=await api("/api/model/status")}catch{S.model=null}}
async function loadPorts(){try{const p=await api("/api/ports"),s=$("#port");if(s){let selected=settings().port,selectedInfo=p.find(x=>x.device===selected);if(!selectedInfo||/bluetooth/i.test(`${selectedInfo.description||""} ${selectedInfo.hwid||""}`)){const candidates=p.filter(x=>!/bluetooth/i.test(`${x.description||""} ${x.hwid||""}`)),auto=candidates.find(x=>/arduino/i.test(`${x.description||""} ${x.hwid||""}`))||(candidates.length===1?candidates[0]:null);selected=auto?auto.device:"";setSetting("port",selected)}
 s.innerHTML=`<option value="">Select Arduino USB serial port</option>`+p.map(x=>`<option value="${esc(x.device)}" ${x.device===selected?"selected":""}>${esc(x.device)} — ${esc(x.description||"Serial device")}</option>`).join("");s.value=selected}}catch(e){setErr("Backend unavailable",e.message,loadPorts)}}
/* ===== Layout / render / init ===== */
function applyTheme(){document.documentElement.dataset.theme=ui.theme;document.documentElement.classList.toggle("rm",ui.rm);$("#thm").textContent=ui.theme==="dark"?"☼":"☾"}
function toggleTheme(){ui.theme=ui.theme==="dark"?"light":"dark";store.set("dhvani:theme",ui.theme);applyTheme()}
function toggleRM(){ui.rm=!ui.rm;store.set("dhvani:rm",ui.rm);applyTheme();render()}
function render(){$("#side").innerHTML=`<div class="brand"><b>DHVANI</b><div>Mind-to-Voice</div></div>${NAV.map(([n,i,k])=>`<button class="nv ${n===page?"on":""}" onclick="go('${n}')"><span>${i}</span>${t(k)}</button>`).join("")}<div class="side-foot sm"><span data-h="conn"></span><div class="mut" style="margin-top:6px">by T.T.S</div></div>`;
 $("#ban").innerHTML=`<div class="banner" role="note">${esc(t("disc"))}</div>`;const p=$("#page");p.className="pg";p.innerHTML=PAGES[page]();bindAll();
 if(page==="Settings")loadPorts();if(page==="Assistant")paintChat();if(page==="Developer"&&S.dev&&S.tab==="rec"){paintRec();showRecs()}}
async function init(){applyTheme();render();
 try{await refreshModel();S.health=await api("/api/health");S.status=await api("/api/eeg/status");if(st().live)await api("/api/live/stop","POST");st().live=false}   /* fresh session: communication always starts OFF */
 catch(e){setErr("Backend unavailable",e.message,init)}openSocket();render()}
(function splash(){const s=$("#splash");if(ui.rm){s.remove();return}setTimeout(()=>{s.classList.add("out");setTimeout(()=>s.remove(),600)},1600)})();
init();
</script></body></html>
